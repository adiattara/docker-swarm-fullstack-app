services:
  back:
    build:
      context: ./back
    ports:
      - "8364:3000"
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD_FILE: /run/secrets/db_password   # ← remplace PGPASSWORD
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      # Reaches the database on back-pg, the front on front-back.
      - back-pg
      - front-back
    restart: unless-stopped

    secrets:
      - db_password

  front:
    build:
      context: ./front
    ports:
      - "${FRONT_PORT:-4200}:1234"
    depends_on:
      back:
        condition: service_healthy
    networks:
      # Front and database never share a network.
      - front-back
    restart: unless-stopped

networks:
  front-back:
    name: front-back
    driver: bridge
  back-pg:
    name: back-pg
    driver: bridge
