services:
  adminer:
    image: adminer:6.1.2
    container_name: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      # Adminer is a database client: it belongs on the same network as db.
      - back-pg
    restart: always

networks:
  back-pg:
    name: back-pg
    driver: bridge
