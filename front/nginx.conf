server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress the text assets on the fly; the bundle is ~250 kB of JS.
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Swarm ignores depends_on and gives a fresh IP to every new task, so the
    # back must be resolved at request time: nginx only defers the lookup when
    # the upstream is a variable. The resolver is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The app calls /api/items on its own origin; nginx forwards it to the
    # back container, so the API port never has to be published.
    location /api/ {
        set $back_upstream http://back:3000;
        proxy_pass $back_upstream;
    }

    # Angular routes are resolved in the browser: an unknown path must return
    # the app shell, otherwise refreshing /items would be a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references hashed bundles, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Every file below carries a content hash in its name: cache it forever.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }
}
