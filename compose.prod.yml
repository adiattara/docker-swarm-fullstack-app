# Production stack — no local build.
# Every service runs an image published in the registry, so this file is
# self-contained and works without the sources:
#   docker compose -f compose.prod.yml up -d
services:
  db:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - back-pg
    secrets:
      - db_password
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == adiattara-ZenBook-UX325EA-UX325EA
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  back:
    image: ghcr.io/adiattara/docker-swarm-fullstack-app/back:1.0.0
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD_FILE: /run/secrets/db_password
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - back-pg
      - front-back
    secrets:
      - db_password
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
        parallelism: 1

  front:
    image: ghcr.io/adiattara/docker-swarm-fullstack-app/front:1.0.1
    ports:
      - "${FRONT_PORT:-4200}:80"
    depends_on:
      - back
    networks:
      - front-back
    restart: unless-stopped
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: start-first
        parallelism: 1

volumes:
  data:
    driver: local

networks:
  front-back:
  back-pg:

secrets:
  db_password:
    external: true
