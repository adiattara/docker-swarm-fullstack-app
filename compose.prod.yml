# Production stack — no local build.
# Every service runs an image published in the registry, so this file is
# self-contained and works without the sources:
#   docker compose -f compose.prod.yml up -d
services:
  db:
    image: "postgres:16-alpine"
    container_name: "postgres_db"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - back-pg
    secrets:
      - db_password
    restart: unless-stopped

  back:
    image: ghcr.io/adiattara/docker-swarm-fullstack-app/back:1.0.0
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD_FILE: /run/secrets/db_password
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-pg
      - front-back
    secrets:
      - db_password
    restart: unless-stopped

  front:
    image: ghcr.io/adiattara/docker-swarm-fullstack-app/front:1.0.0
    ports:
      - "${FRONT_PORT:-4200}:80"
    depends_on:
      back:
        condition: service_healthy
    networks:
      - front-back
    restart: unless-stopped

volumes:
  data:
    driver: local

networks:
  front-back:
    name: front-back
    driver: bridge
  back-pg:
    name: back-pg
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
